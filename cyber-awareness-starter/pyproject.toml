[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "cyber-awareness-platform"
version = "0.1.0"
description = "Azure OpenAI cybersecurity awareness poster campaign application"
requires-python = ">=3.11"
dependencies = [
  "apscheduler>=3.10,<4",
  "azure-identity>=1.19,<2",
  "bleach>=6.2,<7",
  "email-validator>=2.2,<3",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "itsdangerous>=2.2,<3",
  "msal>=1.31,<2",
  "openai>=2.0,<3",
  "pillow>=11,<13",
  "psycopg[binary]>=3.2,<4",
  "python-dotenv>=1.0,<2",
  "pydantic-settings>=2.7,<3",
  "pyjwt[crypto]>=2.10,<3",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
desktop = [
  "pywebview>=5.3,<7",
]
build = [
  "pyinstaller>=6.11,<7",
]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
]

[project.scripts]
cyber-awareness-desktop = "app.desktop:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
