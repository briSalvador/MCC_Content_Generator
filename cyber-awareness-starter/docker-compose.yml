services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: cyber
      POSTGRES_USER: cyber
      POSTGRES_PASSWORD: local-only-password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cyber -d cyber"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: ${DOCKER_DATABASE_URL:-postgresql+psycopg://cyber:local-only-password@db:5432/cyber}
      POSTER_STORAGE_PATH: /app/generated_posters
    volumes:
      - ./generated_posters:/app/generated_posters
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
